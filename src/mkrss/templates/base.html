<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}mkrss{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>📰</text></svg>">
</head>
<body>
<nav>
  <a href="/" class="brand">mkrss</a>
  <div class="spacer"></div>
  {% if request.cookies.get('mkrss_session') %}
  <form method="post" action="/logout"><button class="link">log out</button></form>
  {% endif %}
</nav>
<main>{% block content %}{% endblock %}</main>
<script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
{% block scripts %}{% endblock %}
</body>
</html>
